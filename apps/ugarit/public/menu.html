<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Ugarit — Menu API Preview</title><style>body{margin:0;background:#f7f4ed;color:#12354c;font:16px Arial}header{background:#022e4c;color:#f7eee2;padding:40px 8%;text-align:center}h1{font:48px Georgia;margin:0}main{max-width:1000px;margin:40px auto;padding:0 22px}h2{font:32px Georgia;border-bottom:1px solid #cbb8a8;padding-bottom:12px}section{margin-bottom:45px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.dish{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px #1231}.dish img{width:100%;height:170px;object-fit:cover}.detail{padding:15px}.price{float:right;color:#56061d}.description{color:#74828b;line-height:1.5;font-size:14px}.unavailable{color:#aa5360}</style></head><body><header><h1>Ugarit</h1><p>INDULGE YOUR SENSES</p></header><main id="content">Loading...</main><script>const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));fetch('/api/menu').then(r=>r.json()).then(d=>{document.getElementById('content').innerHTML=d.sections.map(s=>`<section><h2>${esc(s.name)}</h2><p>${esc(s.description)}</p><div class="grid">${d.items.filter(i=>i.sectionId===s.id).map(i=>`<article class="dish">${i.image?`<img src="${esc(i.image)}" alt="${esc(i.name)}">`:''}<div class="detail"><strong>${esc(i.name)}</strong><span class="price">$${i.price.toFixed(2)}</span><p class="description">${esc(i.description)}</p>${!i.available?'<small class="unavailable">Currently unavailable</small>':''}</div></article>`).join('')}</div></section>`).join('')||'<p>No published categories yet. Add categories and dishes in the admin panel.</p>'}).catch(()=>document.getElementById('content').textContent='Unable to load menu.');</script></body></html>
